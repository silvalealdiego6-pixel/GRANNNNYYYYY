// Color Ball editor
function initBallCanvas() {
    const canvas = document.getElementById('ball-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0088ff';
    ctx.beginPath(); ctx.arc(40,40,38,0,Math.PI*2); ctx.fill();
    let drawing = false;
    canvas.onmousedown = canvas.ontouchstart = (e) => { drawing = true; paint(e); };
    canvas.onmouseup = canvas.ontouchend = () => { drawing = false; saveBall(); };
    canvas.onmousemove = canvas.ontouchmove = (e) => { if(drawing) paint(e); };
    function paint(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        ctx.fillStyle = document.getElementById('paint-color').value;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    }
    function saveBall() { ballDrawing = canvas.toDataURL(); }
}
function clearBall() {
    const canvas = document.getElementById('ball-canvas');
    const ctx = canvas.getContext('2d');
    const col = document.getElementById('color-select').value;
    ctx.fillStyle = '#' + parseInt(col).toString(16).padStart(6,'0');
    ctx.beginPath(); ctx.arc(40,40,38,0,Math.PI*2); ctx.fill();
    ballDrawing = null;
}
function updateBallPreview() {
    clearBall();
}

function getPlayerSettings() {
    myNick = document.getElementById('nick-input').value.trim() || "Travesso";
    myColor = parseInt(document.getElementById('color-select').value);
    // Salva o desenho da bola se tiver
    const canvas = document.getElementById('ball-canvas');

    }

function createCustomRoom() {
    getPlayerSettings();
    let input = document.getElementById('room-code-input').value.trim();
    if (!input) return alert("Digite um código para a sala!");
    currentRoomId = input.toUpperCase();
    startCutscene();
}

function joinCustomRoom() {
    getPlayerSettings();
    let input = document.getElementById('room-code-input').value.trim();
    if (!input) return alert("Digite o código da sala!");
    currentRoomId = input.toUpperCase();
    startCutscene();
}

function startAloneGame() { 
    getPlayerSettings();
    startCutscene();
}

function startCutscene() {
    document.getElementById('ui').style.display = 'none';
    document.getElementById('cutscene').style.display = 'block';
    
    const text = `ola prazer sou ${myNick}

eu sempre fui bem travesso
so que minha vo me deixou de castigo

e como quero brincar
vou roubar o carro
e ganhar 1 milhao de dolares...

preparando fuga...`;

    const el = document.getElementById('cutscene-text');
    el.innerHTML = '';
    let i = 0;

    function typeWriter() {
        if (i < text.length) {
            el.innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 35);
        } else {
            setTimeout(() => {
                document.getElementById('cutscene').style.display = 'none';
                showGameUI();
                startGame();
                if (currentRoomId) initMQTT();
            }, 1800);
        }
    }
    typeWriter();
}

function initMQTT() {
    mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    mqttClient.on('connect', () => {
        mqttClient.subscribe(`granny2d/rooms/${currentRoomId}`);
    });
    mqttClient.on('message', (topic, message) => {
        try {
            let data = JSON.parse(message.toString());
            if (data.id === myPlayerId) return;
            if (data.type === 'move') {
                if (!scene) return;
                if (!players[data.id]) createOtherPlayer(data.id, data.color, data.nick);
                if (players[data.id]) {
                    players[data.id].setPosition(data.x, data.y);
                    if (data.nick && players[data.id].nameText) {
                        players[data.id].nameText.setPosition(data.x, data.y - 20);
                        players[data.id].nameText.setText(data.nick);
                    }
                }
            } else if (data.type === 'action') {
                handleGameEvents(data.action, data.key);
            }
        } catch(e) {}
    });
}

function sendNetPosition() {
    if (mqttClient && mqttClient.connected && players[myPlayerId]) {
        let p = players[myPlayerId];
        mqttClient.publish(`granny2d/rooms/${currentRoomId}`, JSON.stringify({
            type: 'move', id: myPlayerId, color: myColor, nick: myNick,
            x: Math.round(p.x), y: Math.round(p.y)
        }));
    }
}

function sendNetAction(action, key = null) {
    if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`granny2d/rooms/${currentRoomId}`, JSON.stringify({
            type: 'action', action: action, key: key
        }));
    }
}

function handleGameEvents(action, keyName = null) {
    if (action === 'collect_key') {
        gameKeys[keyName] = true;
        if (keyName === 'red' && redKeyObj) { redKeyObj.destroy(); redKeyObj = null; }
        if (keyName === 'yellow' && yellowKeyObj) { yellowKeyObj.destroy(); yellowKeyObj = null; }
        if (keyName === 'blue' && blueKeyObj) { blueKeyObj.destroy(); blueKeyObj = null; }
        if (keyName === 'green' && greenKeyObj) { greenKeyObj.destroy(); greenKeyObj = null; }
        if (keyName === 'purple' && purpleKeyObj) { purpleKeyObj.destroy(); purpleKeyObj = null; }
        if (keyName === 'orange' && orangeKeyObj) { orangeKeyObj.destroy(); orangeKeyObj = null; }
        if (keyName === 'pink' && pinkKeyObj) { pinkKeyObj.destroy(); pinkKeyObj = null; }
        if (keyName === 'cyan' && cyanKeyObj) { cyanKeyObj.destroy(); cyanKeyObj = null; }
        if (keyName === 'white' && whiteKeyObj) { whiteKeyObj.destroy(); whiteKeyObj = null; }
    }
    if (action === 'open_door') {
        if (keyName === 'red' && redDoorObj) { redDoorObj.destroy(); redDoorObj = null; }
        if (keyName === 'yellow' && yellowDoorObj) { yellowDoorObj.destroy(); yellowDoorObj = null; }
        if (keyName === 'blue' && blueDoorObj) { blueDoorObj.destroy(); blueDoorObj = null; }
        if (keyName === 'green' && greenDoorObj) { greenDoorObj.destroy(); greenDoorObj = null; }
        if (keyName === 'purple' && purpleDoorObj) { purpleDoorObj.destroy(); purpleDoorObj = null; }
        if (keyName === 'orange' && orangeDoorObj) { orangeDoorObj.destroy(); orangeDoorObj = null; }
        if (keyName === 'pink' && pinkDoorObj) { pinkDoorObj.destroy(); pinkDoorObj = null; }
        if (keyName === 'cyan' && cyanDoorObj) { cyanDoorObj.destroy(); cyanDoorObj = null; }
        if (keyName === 'white' && whiteDoorObj) { whiteDoorObj.destroy(); whiteDoorObj = null; }
    }
    if (action === 'collect_part') {
        if (keyName && !carParts[keyName]) {
            carParts[keyName] = true;
            // Tenta destruir o objeto local se ainda existir
            const partMap = {
                engine: 'engineObj', gas: 'gasObj', tire: 'tireObj', battery: 'batteryObj',
                sparkPlug: 'sparkPlugObj', carKey: 'carKeyObj', radiator: 'radiatorObj',
                alternator: 'alternatorObj', oil: 'oilObj', mirror: 'mirrorObj', seat: 'seatObj',
                exhaust: 'exhaustObj', headlight: 'headlightObj', horn: 'hornObj',
                radio: 'radioObj', belt: 'beltObj', filter: 'filterObj', pump: 'pumpObj',
                cable: 'cableObj', fuse: 'fuseObj', wheel: 'wheelObj'
            };
            const varName = partMap[keyName];
            if (varName && window[varName]) {
                try { window[varName].destroy(); } catch(e){}
                window[varName] = null;
            }
        }
    }
    updateHUD();
}

function showGameUI() {
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('inv').style.display = 'block';
    document.getElementById('btn-pause').style.display = 'flex';
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
    if (scene) isPaused ? scene.physics.pause() : scene.physics.resume();
}

function exitToMainMenu() { 
    if (mqttClient) mqttClient.end();
    location.reload(); 
}

function startGame() {

        type: Phaser.AUTO, width: 360, height: 500,
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: { preload: preload, create: create, update: update }
    };
    game = new Phaser.Game(config);
}

function preload() {

    let g = this.add.graphics();

    // Player
    g.fillStyle(0xffffff); g.fillCircle(10, 10, 10); g.generateTexture('player_base', 20, 20); g.clear();
    
    // Granny
    g.fillStyle(0x8b008b); g.fillRect(4, 10, 16, 18);
    g.fillStyle(0xffe0bd); g.fillCircle(12, 8, 7);
    g.fillStyle(0xdcdcdc); g.fillCircle(12, 4, 4);
    g.fillStyle(0x8b4513); g.fillRect(18, 12, 3, 14); g.fillRect(16, 12, 5, 3);
    g.generateTexture('granny_sprite', 24, 28); g.clear();

    // Wall
    g.fillStyle(0x444444); g.fillRect(0, 0, 20, 20); g.generateTexture('wall', 20, 20); g.clear();

    // Keys
    g.fillStyle(0xff0000); g.fillRect(0, 0, 10, 10); g.generateTexture('red_key', 10, 10); g.clear();
    g.fillStyle(0xffff00); g.fillRect(0, 0, 10, 10); g.generateTexture('yellow_key', 10, 10); g.clear();
    g.fillStyle(0x00ffff); g.fillRect(0, 0, 10, 10); g.generateTexture('blue_key', 10, 10); g.clear();
    g.fillStyle(0x00ff00); g.fillRect(0, 0, 10, 10); g.generateTexture('green_key', 10, 10); g.clear();
    g.fillStyle(0xaa00ff); g.fillRect(0, 0, 10, 10); g.generateTexture('purple_key', 10, 10); g.clear();
    g.fillStyle(0xff8800); g.fillRect(0, 0, 10, 10); g.generateTexture('orange_key', 10, 10); g.clear();
    g.fillStyle(0xff66aa); g.fillRect(0, 0, 10, 10); g.generateTexture('pink_key', 10, 10); g.clear();
    g.fillStyle(0x00ccff); g.fillRect(0, 0, 10, 10); g.generateTexture('cyan_key', 10, 10); g.clear();
    g.fillStyle(0xffffff); g.fillRect(0, 0, 10, 10); g.generateTexture('white_key', 10, 10); g.clear();

    // Doors
    g.fillStyle(0xff2222); g.fillRect(0, 0, 60, 15); g.generateTexture('red_door', 60, 15); g.clear();
    g.fillStyle(0xffff22); g.fillRect(0, 0, 60, 15); g.generateTexture('yellow_door', 60, 15); g.clear();
    g.fillStyle(0x00ffff); g.fillRect(0, 0, 60, 15); g.generateTexture('blue_door', 60, 15); g.clear();
    g.fillStyle(0x00ff00); g.fillRect(0, 0, 60, 15); g.generateTexture('green_door', 60, 15); g.clear();
    g.fillStyle(0xaa00ff); g.fillRect(0, 0, 60, 15); g.generateTexture('purple_door', 60, 15); g.clear();
    g.fillStyle(0xff8800); g.fillRect(0, 0, 60, 15); g.generateTexture('orange_door', 60, 15); g.clear();
    g.fillStyle(0xff66aa); g.fillRect(0, 0, 60, 15); g.generateTexture('pink_door', 60, 15); g.clear();
    g.fillStyle(0x00ccff); g.fillRect(0, 0, 60, 15); g.generateTexture('cyan_door', 60, 15); g.clear();
    g.fillStyle(0xffffff); g.fillRect(0, 0, 60, 15); g.generateTexture('white_door', 60, 15); g.clear();

    for(let x=700; x<1000; x+=40) for(let y=20; y<200; y+=40) {
        scene.add.image(x+20, y+20, 'floor_tile').setAlpha(0.7);
    }

    // (elas eram só exemplo de onde fica a porta)
    banheiroMap2d.forEach(r => {
        // Pula os retângulos brancos / com label "Porta" — esses não são parede
        if (r.color === "#ffffff" || r.label === "Porta") return;

        const wx = offsetX + (r.x * scale);
        const wy = offsetY + (r.y * scale);
        const ww = Math.max(r.w * scale, 18);
        const wh = Math.max(r.h * scale, 18);

        const color = Phaser.Display.Color.HexStringToColor(r.color).color;
        const wallRect = scene.add.rectangle(wx + ww/2, wy + wh/2, ww, wh, color);
        scene.physics.add.existing(wallRect, true);
        walls.add(wallRect);
    });

    // Porta NORMAL do banheiro (abre com chave branca)
    // Posicionada na entrada do banheiro com vão livre
    whiteDoorObj = scene.physics.add.staticSprite(780, 200, 'white_door');

    fuseObj = scene.physics.add.sprite(500, 1800, 'fuse');

    // Player
    if (ballDrawing) {
        // Usa o desenho da bola como textura
        const img = new Image();
        img.src = ballDrawing;
        // fallback enquanto carrega
        players[myPlayerId] = scene.physics.add.sprite(80, 80, 'player_base');
        players[myPlayerId].setTint(myColor);
        img.onload = () => {
            scene.textures.addImage('custom_ball', img);
            if (players[myPlayerId]) {
                players[myPlayerId].setTexture('custom_ball');
                players[myPlayerId].setDisplaySize(20, 20);
                players[myPlayerId].clearTint();
            }
        };

        players[myPlayerId] = scene.physics.add.sprite(80, 80, 'player_base');
        players[myPlayerId].setTint(myColor);
    }
    players[myPlayerId].setCollideWorldBounds(true);
    scene.physics.add.collider(players[myPlayerId], walls);
    this.cameras.main.startFollow(players[myPlayerId], true, 0.08, 0.08);
    // Nome próprio
    players[myPlayerId].nameText = scene.add.text(80, 60, myNick, {
        font: '11px Arial', fill: '#00ff88',
        backgroundColor: 'rgba(0,0,0,0.5)', padding: { x: 4, y: 2 }
    }).setOrigin(0.5);

    // Agora sim: overlaps dos novos itens (depois do player existir)
    if (window.clockObj) {
        scene.physics.add.overlap(players[myPlayerId], window.clockObj, () => {
            if (!hasClock) {
                hasClock = true;
                window.clockObj.destroy();
                document.getElementById('btn-place').style.display = 'block';
                updateHUD();
            }
        });
    }
    if (window.visionProObj) {
        scene.physics.add.overlap(players[myPlayerId], window.visionProObj, () => {
            if (!hasVisionPro) {
                hasVisionPro = true;
                window.visionProObj.destroy();
                document.getElementById('btn-use').style.display = 'block';
                updateHUD();
            }
        });
    }

    // Teclado
    cursors = this.input.keyboard.createCursorKeys();
    wasd = this.input.keyboard.addKeys('W,S,A,D');
    // Garante que o body do player está ativo
    if (players[myPlayerId] && players[myPlayerId].body) {
        players[myPlayerId].body.setAllowGravity(false);
        players[myPlayerId].body.moves = true;
    }

    aiGranny = scene.physics.add.sprite(650, 650, 'granny_sprite');
    scene.physics.add.collider(aiGranny, walls);

    // Avó NÃO atravessa portas (colide com todas elas)
    const allDoors = [redDoorObj, yellowDoorObj, blueDoorObj, greenDoorObj, purpleDoorObj, orangeDoorObj, pinkDoorObj, cyanDoorObj, whiteDoorObj];
    allDoors.forEach(door => {
        if (door) scene.physics.add.collider(aiGranny, door);
    });

    lastGrannyPos = {x: aiGranny.x, y: aiGranny.y};

    setupInteractions();
    setupMobileControls();
}

function createOtherPlayer(id, color, nick) {
    players[id] = scene.physics.add.sprite(80, 80, 'player_base');
    if (color) players[id].setTint(color);
    // Nome flutuante
    const nameText = scene.add.text(80, 60, nick || id, {
        font: '11px Arial',
        fill: '#ffffff',
        backgroundColor: 'rgba(0,0,0,0.6)',
        padding: { x: 4, y: 2 }
    }).setOrigin(0.5);
    players[id].nameText = nameText;
}

function setupInteractions() {
    const keys = [
        {obj: redKeyObj, name: 'red'}, {obj: yellowKeyObj, name: 'yellow'},
        {obj: blueKeyObj, name: 'blue'}, {obj: greenKeyObj, name: 'green'},
        {obj: purpleKeyObj, name: 'purple'}, {obj: orangeKeyObj, name: 'orange'},
        {obj: pinkKeyObj, name: 'pink'}, {obj: cyanKeyObj, name: 'cyan'},
        {obj: whiteKeyObj, name: 'white'}
    ];
    keys.forEach(k => {
        if (k.obj) {
            scene.physics.add.overlap(players[myPlayerId], k.obj, () => {
                handleGameEvents('collect_key', k.name);
                sendNetAction('collect_key', k.name);
            });
        }
    });

    const doors = [
        {obj: redDoorObj, name: 'red'}, {obj: yellowDoorObj, name: 'yellow'},
        {obj: blueDoorObj, name: 'blue'}, {obj: greenDoorObj, name: 'green'},
        {obj: purpleDoorObj, name: 'purple'}, {obj: orangeDoorObj, name: 'orange'},
        {obj: pinkDoorObj, name: 'pink'}, {obj: cyanDoorObj, name: 'cyan'},
        {obj: whiteDoorObj, name: 'white'}
    ];
    doors.forEach(d => {
        if (d.obj) {
            scene.physics.add.collider(players[myPlayerId], d.obj, () => {
                if (gameKeys[d.name]) {
                    handleGameEvents('open_door', d.name);
                    sendNetAction('open_door', d.name);
                }
            });
        }
    });

    const parts = [
        {obj: engineObj, key: 'engine'}, {obj: gasObj, key: 'gas'}, {obj: tireObj, key: 'tire'},
        {obj: batteryObj, key: 'battery'}, {obj: sparkPlugObj, key: 'sparkPlug'}, {obj: carKeyObj, key: 'carKey'},
        {obj: radiatorObj, key: 'radiator'}, {obj: alternatorObj, key: 'alternator'}, {obj: oilObj, key: 'oil'},
        {obj: mirrorObj, key: 'mirror'}, {obj: seatObj, key: 'seat'}, {obj: exhaustObj, key: 'exhaust'},
        {obj: headlightObj, key: 'headlight'}, {obj: hornObj, key: 'horn'}, {obj: radioObj, key: 'radio'},
        {obj: beltObj, key: 'belt'}, {obj: filterObj, key: 'filter'}, {obj: pumpObj, key: 'pump'},
        {obj: cableObj, key: 'cable'}, {obj: fuseObj, key: 'fuse'},
        {obj: window.wheelObj, key: 'wheel'}
    ];
    parts.forEach(p => {
        if (p.obj) {
            scene.physics.add.overlap(players[myPlayerId], p.obj, () => {
                if (!carParts[p.key]) {
                    carParts[p.key] = true;
                    if (p.obj) p.obj.destroy();
                    updateHUD();
                    // Sincroniza pra TODOS no multiplayer
                    sendNetAction('collect_part', p.key);
                }
            });
        }
    });

    scene.physics.add.collider(players[myPlayerId], carObj, () => {
        let allParts = Object.values(carParts).every(v => v === true);
        if (allParts) {
            alert("SENSACIONAL! VOCÊS ENCONTRARAM TODAS AS 21 PEÇAS E FUGIRAM COM O CARRO!");
            location.reload();
        } else {
            let missing = Object.values(carParts).filter(v => !v).length;
            alert(`Ainda faltam ${missing} peças!`);
        }
    });

    scene.physics.add.overlap(players[myPlayerId], shotgunObj, () => {
        if (!hasShotgun) {
            hasShotgun = true;
            if (shotgunObj) shotgunObj.destroy();
            document.getElementById('btn-shoot').style.display = 'block';
            updateHUD();
        }
    });

    // Range maior nas escadas
    scene.physics.add.overlap(players[myPlayerId], stairsToBasement, () => teleportPlayer(850, 950), null, this);
    scene.physics.add.overlap(players[myPlayerId], stairsToGarage, () => teleportPlayer(850, 650), null, this);
    // Aumenta o body das escadas pra facilitar
    if (stairsToBasement && stairsToBasement.body) stairsToBasement.body.setSize(60, 60);
    if (stairsToGarage && stairsToGarage.body) stairsToGarage.body.setSize(60, 60);
}

function useVisionPro() {
    if (!hasVisionPro || visionActive) return;
    visionActive = true;
    visionTimer = 600; // 10 segundos (60fps)
    hasVisionPro = false;
    document.getElementById('btn-use').style.display = 'none';
    if (players[myPlayerId]) {
        players[myPlayerId].setAlpha(0.3);
        // Temporariamente remove colisão com paredes
        players[myPlayerId].body.checkCollision.none = true;
    }
    updateHUD();
}

function placeClock() {
    if (!hasClock || clockPlaced || !players[myPlayerId]) return;
    hasClock = false;
    clockPlaced = true;
    clockBeeping = false;
    clockTimer = 0;
    clockPos = { x: players[myPlayerId].x, y: players[myPlayerId].y };
    document.getElementById('btn-place').style.display = 'none';
    
    // Sprite do relógio no chão
    scene.add.sprite(clockPos.x, clockPos.y, 'clock').setDepth(5);
    updateHUD();
}

function setControlMode(mode) {
    controlMode = mode;
    if (mode === 'analog') {
        document.getElementById('controls').style.display = 'none';
        document.getElementById('analog-zone').style.display = 'block';
    } else {
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('analog-zone').style.display = 'none';
        touchInput = { x: 0, y: 0 };
    }
}

function teleportPlayer(x, y) {
    scene.cameras.main.fadeOut(300, 0, 0, 0);
    scene.cameras.main.once('camerafadeoutcomplete', () => {
        players[myPlayerId].setPosition(x, y);
        scene.cameras.main.fadeIn(300, 0, 0, 0);
    });
}

function shootGun() {
    if (!hasShotgun || shotgunAmmo <= 0) return;
    shotgunAmmo = 0;
    document.getElementById('btn-shoot').style.display = 'none';
    updateHUD();

    if (aiGranny && !isGrannyStunned) {
        let dist = Phaser.Math.Distance.Between(players[myPlayerId].x, players[myPlayerId].y, aiGranny.x, aiGranny.y);
        if (dist < 220) {
            isGrannyStunned = true;
            alert("Tiro certeiro! A Véia desmaiou por 1 minuto!");
            setTimeout(() => { isGrannyStunned = false; }, 60000);
        }
    }
}

function updateHUD() {
    let k = [];
    if (gameKeys.red) k.push("Vermelha");
    if (gameKeys.yellow) k.push("Amarela");
    if (gameKeys.blue) k.push("Azul");
    if (gameKeys.green) k.push("Verde");
    if (gameKeys.purple) k.push("Roxa");
    if (gameKeys.orange) k.push("Laranja");
    if (gameKeys.pink) k.push("Rosa");
    if (gameKeys.cyan) k.push("Ciano");
    if (gameKeys.white) k.push("Branca");
    document.getElementById('keys-list').innerText = k.length > 0 ? k.join(", ") : "Nenhuma";
    
    let parts = Object.values(carParts).filter(v => v).length;
    document.getElementById('car-parts').innerText = parts + "/21";
    document.getElementById('gun-status').innerText = hasShotgun ? (shotgunAmmo > 0 ? "Pronta (1 Tiro)" : "Vazia") : "Não";

    let itens = [];
    if (hasClock) itens.push("Relógio");
    if (hasVisionPro) itens.push("Vision Pro");
    if (visionActive) itens.push("Vision ATIVO");
    if (clockPlaced) itens.push(clockBeeping ? "Relógio APITANDO" : "Relógio colocado");
    document.getElementById('items-list').innerText = itens.length > 0 ? itens.join(", ") : "Nenhum";
}

function updateGrannyAI() {
    if (!aiGranny || isGrannyStunned || !players[myPlayerId]) return;

    let p = players[myPlayerId];
    let dist = Phaser.Math.Distance.Between(p.x, p.y, aiGranny.x, aiGranny.y);

    let moved = Phaser.Math.Distance.Between(aiGranny.x, aiGranny.y, lastGrannyPos.x, lastGrannyPos.y);
    if (moved < 1.2) grannyStuckTimer++;
    else grannyStuckTimer = 0;
    lastGrannyPos = {x: aiGranny.x, y: aiGranny.y};

    const chaseSpeed = 82;
    const patrolSpeed = 65;
    const avoidSpeed = 100;

    // Alvo: se relógio está apitando, vai atrás do relógio
    let targetX = p.x, targetY = p.y;
    if (clockBeeping && clockPos) {
        targetX = clockPos.x;
        targetY = clockPos.y;
        grannyTargetOverride = true;
    } else {
        grannyTargetOverride = false;
        // Predição de drible
        if (p.body && (Math.abs(p.body.velocity.x) > 10 || Math.abs(p.body.velocity.y) > 10)) {
            targetX = p.x + p.body.velocity.x * 0.4;
            targetY = p.y + p.body.velocity.y * 0.4;
        }
    }

    // Desvio inteligente de parede (tenta 3 direções)
    if (grannyStuckTimer > 15) {
        grannyAvoidDir *= -1;
        let baseAngle = Phaser.Math.Angle.Between(aiGranny.x, aiGranny.y, targetX, targetY);
        // Tenta desviar em ângulos diferentes
        let offsets = [1.3, -1.3, 2.0, -2.0];
        let chosen = offsets[Math.floor(Math.random() * offsets.length)];
        aiGranny.setVelocity(
            Math.cos(baseAngle + chosen) * avoidSpeed,
            Math.sin(baseAngle + chosen) * avoidSpeed
        );
        grannyStuckTimer = 0;
        return;
    }

    let distToTarget = Phaser.Math.Distance.Between(aiGranny.x, aiGranny.y, targetX, targetY);

    if (grannyTargetOverride || dist < 480) {
        grannyState = 'chase';
        let angle = Phaser.Math.Angle.Between(aiGranny.x, aiGranny.y, targetX, targetY);
        angle += (Math.random() - 0.5) * 0.12;
        aiGranny.setVelocity(Math.cos(angle) * chaseSpeed, Math.sin(angle) * chaseSpeed);
    } else {
        grannyState = 'patrol';
        let target = patrolPoints[currentPatrolIndex];
        let d = Phaser.Math.Distance.Between(aiGranny.x, aiGranny.y, target.x, target.y);
        if (d < 55) currentPatrolIndex = (currentPatrolIndex + 1) % patrolPoints.length;
        else scene.physics.moveTo(aiGranny, target.x, target.y, patrolSpeed);
        if (grannyStuckTimer > 40) {
            currentPatrolIndex = (currentPatrolIndex + 1) % patrolPoints.length;
            grannyStuckTimer = 0;
        }
    }

    // Captura (só se não estiver distraída pelo relógio)
    if (!grannyTargetOverride && dist < 26) {
        p.setPosition(80, 80);
    }

    // Avó usa as escadas do porão (entra e sai)
    if (stairsToBasement && aiGranny.y > 480 && aiGranny.y < 750 && Math.abs(aiGranny.x - 850) < 50) {
        // Chance de descer pro porão
        if (Math.random() < 0.02 && aiGranny.y < 800) {
            aiGranny.setPosition(850, 950);
        }
    }
    if (stairsToGarage && aiGranny.y > 850 && aiGranny.y < 1000 && Math.abs(aiGranny.x - 850) < 50) {
        if (Math.random() < 0.02) {
            aiGranny.setPosition(850, 650);
        }
    }
}

function update() {
    if (isPaused) return;
    let p = players[myPlayerId];
    if (!p) return;

    let speed = 145;
    p.setVelocity(0);

    let moveX = 0;
    let moveY = 0;

    // Teclado
    if (cursors.left.isDown || (wasd.A && wasd.A.isDown)) moveX = -1;
    else if (cursors.right.isDown || (wasd.D && wasd.D.isDown)) moveX = 1;
    if (cursors.up.isDown || (wasd.W && wasd.W.isDown)) moveY = -1;
    else if (cursors.down.isDown || (wasd.S && wasd.S.isDown)) moveY = 1;

    // Touch / Analógico
    if (touchInput.x !== 0 || touchInput.y !== 0) {
        moveX = touchInput.x;
        moveY = touchInput.y;
    }

    if (moveX !== 0 || moveY !== 0) {
        p.setVelocityX(moveX * speed);
        p.setVelocityY(moveY * speed);
        sendNetPosition();
    }

    // Atualiza posição do nome
    if (p.nameText) p.nameText.setPosition(p.x, p.y - 22);

    // ===== Timers dos itens =====
    // Relógio
    if (clockPlaced) {
        clockTimer++;
        if (!clockBeeping && clockTimer > 300) { // 5 segundos
            clockBeeping = true;
            clockTimer = 0;
        }
        if (clockBeeping && clockTimer > 600) { // 10 segundos apitando
            clockPlaced = false;
            clockBeeping = false;
            clockPos = null;
            clockTimer = 0;
        }
    }

    // Vision Pro
    if (visionActive) {
        visionTimer--;
        if (visionTimer <= 0) {
            visionActive = false;
            if (p) {
                p.setAlpha(1);
                p.body.checkCollision.none = false;
            }
        }
    }

    updateGrannyAI();
    updateHUD();
}

function setupMobileControls() {
    const bindBtn = (id, x, y) => {
        const el = document.getElementById(id);
        const start = (e) => { e.preventDefault(); touchInput.x = x; touchInput.y = y; };
        const end = (e) => { e.preventDefault(); touchInput.x = 0; touchInput.y = 0; };
        el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
        el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
        el.addEventListener('mouseleave', end);
    };
    bindBtn('btn-left', -1, 0);
    bindBtn('btn-right', 1, 0);
    bindBtn('btn-up', 0, -1);
    bindBtn('btn-down', 0, 1);

    // Analógico virtual
    const zone = document.getElementById('analog-zone');
    const stick = document.getElementById('analog-stick');
    const base = document.getElementById('analog-base');
    let dragging = false;

    function handleAnalog(e) {
        e.preventDefault();
        const rect = base.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const max = 35;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > max) { dx = dx / len * max; dy = dy / len * max; }
        stick.style.left = (35 + dx) + 'px';
        stick.style.top = (35 + dy) + 'px';
        touchInput.x = dx / max;
        touchInput.y = dy / max;
    }

    function endAnalog(e) {
        e.preventDefault();
        dragging = false;
        stick.style.left = '35px';
        stick.style.top = '35px';
        touchInput = { x: 0, y: 0 };
    }

    base.addEventListener('touchstart', (e) => { dragging = true; handleAnalog(e); });
    base.addEventListener('touchmove', (e) => { if (dragging) handleAnalog(e); });
    base.addEventListener('touchend', endAnalog);
    base.addEventListener('mousedown', (e) => { dragging = true; handleAnalog(e); });
    window.addEventListener('mousemove', (e) => { if (dragging) handleAnalog(e); });
    window.addEventListener('mouseup', endAnalog);
}
